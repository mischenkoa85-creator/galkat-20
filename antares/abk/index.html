<title>АБК Антарес · СЕС на даху</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Стандарт Антарес (як 3D-двійник даху цеху): модель на весь екран, угорі — види, режими й легенда, праворуч компас;
   унизу — панель (мала / половина / повна) з рядком сонця і вкладками розділів. */
:root{
  color-scheme:light;
  --bg:#f4f3ef; --surface:#fcfcfb; --surface-2:#efeee9; --surface-3:#e6e5df;
  --ink:#141413; --ink-2:#52514e; --ink-3:#7d7c76; --line:#e0dfd8; --line-2:#cfcec7;
  --ours:#0f6b80; --ours-soft:#dcedf1; --east:#2f6fb0; --west:#1d8f8a; --south:#5b4fa3; --part:#d4962e; --shade:#5c656d;
  --sun:#b86e00; --crit:#d03b3b; --ok:#2c7a4b; --warn:#b4461b; --warn-soft:#f8e7df;
  --sky:#dfe6ec; --ground:#c9cfc6; --accent:#2a78d6; --on-accent:#fff;
  --gl:max(12px, env(safe-area-inset-left, 0px)); --gr:max(12px, env(safe-area-inset-right, 0px));
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2c2c29; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e87; --line:#2f2f2c; --line-2:#3e3e3a;
  --ours:#4cb6cc; --ours-soft:#123039; --east:#5d9be0; --west:#3cc0b8; --south:#9a8ce6; --part:#f0b048; --shade:#7d8892;
  --sun:#f0b44a; --crit:#e66767; --ok:#5fbf86; --warn:#ec8a63; --warn-soft:#3a221a; --sky:#1c2227; --ground:#2a322f; --accent:#3987e5; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2c2c29; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e87; --line:#2f2f2c; --line-2:#3e3e3a;
  --ours:#4cb6cc; --ours-soft:#123039; --east:#5d9be0; --west:#3cc0b8; --south:#9a8ce6; --part:#f0b048; --shade:#7d8892;
  --sun:#f0b44a; --crit:#e66767; --ok:#5fbf86; --warn:#ec8a63; --warn-soft:#3a221a; --sky:#1c2227; --ground:#2a322f; --accent:#3987e5; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-text-size-adjust:100%}
body{overflow:hidden}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
/* верхній рядок */
.bar{flex:none;display:flex;align-items:center;gap:8px 12px;padding:6px var(--gr) 6px var(--gl);border-bottom:1px solid var(--line);background:var(--surface)}
.bar h1{margin:0;font-size:16px;line-height:1.2;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.bar h1 small{font-weight:400;color:var(--ink-2);font-size:13px;margin-left:8px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--bg);background:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
/* 3D */
.view{position:relative;flex:1 1 0;min-height:120px;background:var(--sky);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;z-index:1}
.lbl{position:absolute;transform:translate(-50%,-100%);font:500 11px/1.2 var(--font);color:var(--ink);background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line);padding:2px 6px;border-radius:5px;white-space:nowrap}
.lbl.n{font:700 12px var(--mono);color:var(--crit);background:transparent;border:0}
.lbl.hr{font:600 10.5px var(--mono);color:var(--sun);background:transparent;border:0;padding:0;transform:translate(-50%,-140%)}
.hudwrap{position:absolute;left:var(--gl);top:10px;max-width:calc(100% - 66px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:3}
.hudrow{display:flex;gap:6px;align-items:center;max-width:100%}
.pill{display:flex;gap:2px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:9px;padding:2px;backdrop-filter:blur(6px);overflow-x:auto;scrollbar-width:none;max-width:100%}
.pill::-webkit-scrollbar{display:none}
.pill button{flex:none;border:0;background:transparent;border-radius:7px;padding:5px 9px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.pill button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.hbtn{flex:none;min-width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);color:var(--ink-2);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:13px;padding:0 6px}
.ctx{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:100%}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:12px;color:var(--ink-2);backdrop-filter:blur(6px);max-width:min(560px,100%)}
.legend .t{color:var(--ink);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15);display:inline-block}
.compass{position:absolute;right:var(--gr);top:10px;width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);display:grid;place-items:center;z-index:3;backdrop-filter:blur(6px)}
.compass svg{width:38px;height:38px}
.tip{position:absolute;left:0;top:0;z-index:6;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:6px 26px 7px 8px;font-size:12px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.14);max-width:300px}
.tip b{display:block;font-weight:650}
.tip .yr{display:block;margin-top:4px;font-size:12px;color:var(--ink-2)}
.tip .live{display:block;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.tip .x{position:absolute;right:2px;top:2px;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--ink-3);font-size:14px;line-height:1}
.tip .x:hover{background:var(--surface-2);color:var(--ink)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:14px;background:var(--sky);z-index:7}
/* нижня панель */
.sheet{flex:none;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -3px 12px rgba(0,0,0,.12);position:relative;z-index:8}
.sheet[data-s="peek"]{height:auto}
.sheet[data-s="half"]{height:max(280px,44svh)}
.sheet[data-s="full"]{height:max(320px,82svh)}
.sheet[data-s="peek"] .panes{display:none}
.grab{display:block;width:100%;border:0;background:none;padding:6px 0 2px;cursor:grab;touch-action:none}
.grab i{display:block;width:44px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto}
.grab:hover i{background:var(--accent)}
.sunrow{display:flex;align-items:center;gap:8px;padding:2px var(--gr) 0 var(--gl)}
.pbtn{flex:none;min-width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:13px;padding:0 7px;display:grid;place-items:center}
#play{background:var(--accent);border-color:var(--accent);color:var(--on-accent);min-width:38px}
#time{flex:1;min-width:70px;accent-color:var(--accent)}
#clock{flex:none;font-size:16px;font-weight:650;min-width:46px;text-align:right}
#season{min-width:64px;font-weight:600}
.more{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px var(--gr) 0 var(--gl);font-size:12.5px;color:var(--ink-2)}
.more .chips{display:flex;gap:4px;flex-wrap:wrap}
.more .chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 9px;font-size:12.5px;color:var(--ink-2)}
.more .chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.more input[type=date]{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:3px 8px;font-size:12.5px}
.more b{color:var(--ink)}
.read{display:flex;flex-wrap:wrap;gap:2px 16px;padding:5px var(--gr) 6px var(--gl);font-size:12.5px;color:var(--ink-2)}
.read b{color:var(--ink);font-weight:650}
.read .sun b{color:var(--sun)}
.read .who{font-weight:600;color:var(--ours)}
.tabbar{flex:none;display:flex;align-items:stretch;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabnav{flex:none;width:28px;border:0;background:transparent;color:var(--ink-2);font-size:18px;line-height:1}
.tabs{flex:1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;padding:8px 10px 9px;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.panes{flex:1 1 0;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px var(--gr) 24px var(--gl)}
.pane{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 28px;align-items:start}
.pane > .ph,.pane > .wide{grid-column:1/-1}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:0 28px}
/* вміст розділів */
.ph{display:flex;flex-direction:column;gap:3px}
.ph .eyebrow{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--ours)}
.ph h2{margin:0;font-size:16px;font-weight:650;line-height:1.25}
.ph p{margin:0;color:var(--ink-2)}
.ph .seg{align-self:flex-start;margin-top:6px}
.kv{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:6px 12px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.kv dd small{display:block;font:400 11.5px var(--font);color:var(--ink-3)}
h3{margin:0 0 6px;font-size:12.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0}
.blk p{margin:0;font-size:13px}
.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp th,.cmp td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--ink-2);font-weight:400}
.cmp thead th{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--ours)}
.cmp td{font-family:var(--mono)}
.cmp tr.tot td{font-weight:650;color:var(--ink)}
.note{border-radius:8px;padding:9px 11px;font-size:12.5px}
.note.warn{background:var(--warn-soft);border-left:3px solid var(--warn)}
.note.ok{background:var(--surface-2);border-left:3px solid var(--ok)}
.lay{display:flex;flex-direction:column}
.lay label{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.lay input{width:16px;height:16px;accent-color:var(--accent)}
.lay .sw{width:14px;height:4px;border-radius:2px;border:0}
.lay .cnt{margin-left:auto;color:var(--ink-3);font:500 12px var(--mono)}
.src{font-size:12px;color:var(--ink-3);margin:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat .v{font-size:18px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--ink-2);line-height:1.3;margin-top:2px}
.bars{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.bars i{display:block;height:100%}
.gchart{width:100%;max-width:460px;height:auto;display:block}
.blist{margin:0;padding-left:18px;font-size:13px} .blist li{margin:2px 0}
.bar .seg button:disabled{opacity:.5;cursor:progress}
.cmp th.cur,.cmp td.cur{background:color-mix(in srgb,var(--ours) 10%,transparent);color:var(--ink)}
.req{border-bottom:1px solid var(--line);padding:8px 0}
.req .rq{font-size:13px} .req .rq small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.req .rv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.st{font-size:12px;line-height:1.3;border-radius:6px;padding:4px 7px;background:var(--surface-2);border-left:3px solid var(--line-2)}
.st i{display:block;font-style:normal;font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin-bottom:1px}
.st.ok{border-left-color:var(--ok)} .st.no{border-left-color:var(--crit)} .st.q{border-left-color:var(--part)}
.st.cur{box-shadow:inset 0 0 0 1px var(--ours)}
@media (max-width:520px){.req .rv{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  .bar h1{font-size:14.5px} .bar h1 small{display:none}
  .hudwrap{left:8px;top:8px;max-width:calc(100% - 60px)}
  .pill button{padding:4px 7px;font-size:12px}
  .legend{font-size:11.5px;padding:4px 8px}
  .compass{right:8px;top:8px;width:42px;height:42px} .compass svg{width:34px;height:34px}
  .sheet[data-s="half"]{height:max(260px,46svh)} .sheet[data-s="full"]{height:max(300px,86svh)}
  .tabs button{padding:8px 8px 9px;font-size:13px}
  .pane{grid-template-columns:minmax(0,1fr)}
  .tip{max-width:calc(100% - 16px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<div class="app">
  <header class="bar">
    <h1>АБК Антарес · СЕС на даху<small>адмінкорпус · як є і за ДБН</small></h1>
    <div class="seg" id="vars" role="group" aria-label="Варіант розкладки"></div>
  </header>
  <section class="view" id="view" aria-label="3D-модель">
    <canvas id="cv" aria-label="3D-модель адмінкорпусу з сонячними модулями"></canvas>
    <div class="labels" id="labels"></div>
    <div class="hudwrap" id="hudwrap">
      <div class="hudrow">
        <div class="pill" id="cams" role="group" aria-label="Вид"></div>
        <button type="button" class="hbtn" id="ctxtoggle" aria-expanded="true" aria-controls="ctx" title="Сховати режими і легенду" aria-label="Сховати режими і легенду">▴</button>
      </div>
      <div class="ctx" id="ctx">
        <div class="pill" id="modes" role="group" aria-label="Режим"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div class="compass" title="Північ"><svg viewBox="-24 -24 48 48" id="needle" aria-hidden="true">
      <polygon points="0,-20 6,0 0,-4 -6,0" fill="var(--crit)"/><polygon points="0,20 6,0 0,4 -6,0" fill="var(--ink-3)"/>
      <text x="0" y="-8" text-anchor="middle" font-size="8" fill="var(--surface)" font-weight="700">Пн</text></svg></div>
    <div class="tip" id="tip" hidden></div>
    <div class="loading" id="loading">Будую модель…</div>
  </section>
  <aside class="sheet" id="sheet" data-s="half" aria-label="Сонце і розділи">
    <button type="button" class="grab" id="grab" aria-label="Згорнути або розгорнути панель" title="Тягніть або натисніть: згорнути / розгорнути"><i></i></button>
    <div class="sunrow">
      <button type="button" id="play" class="pbtn" aria-label="Запустити сонце" title="Запустити сонце">▶</button>
      <button type="button" id="speed" class="pbtn" title="Швидкість" aria-label="Швидкість">×1</button>
      <input type="range" id="time" min="21" max="123" step="1" value="78" aria-label="Час доби (сонячний)">
      <output id="clock" class="num" for="time">13:00</output>
      <button type="button" id="season" class="pbtn" title="Сезон: Весна → Літо → Осінь → Зима" aria-label="Сезон">Зима</button>
      <button type="button" id="sunmore" class="pbtn" aria-expanded="false" aria-controls="more" title="Дата і деталі" aria-label="Дата і деталі">⋯</button>
    </div>
    <div class="more" id="more" hidden>
      <div class="chips" id="dates" role="group" aria-label="День"></div>
      <input type="date" id="date" min="2026-01-01" max="2026-12-31" aria-label="Будь-яка дата">
      <span id="sunx"></span>
    </div>
    <div class="read" id="now"></div>
    <div class="tabbar">
      <button type="button" class="tabnav" id="tabPrev" aria-label="Попередній розділ">‹</button>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Розділи"></nav>
      <button type="button" class="tabnav" id="tabNext" aria-label="Наступний розділ">›</button>
    </div>
    <div class="panes" id="panes"><div class="pane" id="pane"></div></div>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
