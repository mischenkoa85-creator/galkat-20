/* Стандарт Антарес (як 3D-двійник даху цеху): модель на весь екран, угорі — види, режими й легенда, праворуч компас;

:root{

  --sun:#b86e00; --crit:#d03b3b; --ok:#2c7a4b; --warn:#b4461b; --warn-soft:#f8e7df; --bz:#7fa82a; --dcp:#c7362b; --dcm:#20262b;
  --sky:#dfe6ec; --ground:#c9cfc6; --accent:#2a78d6; --on-accent:#fff;

}

  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2c2c29; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e87; --line:#2f2f2c; --line-2:#3e3e3a;
  --ours:#4cb6cc; --ours-soft:#123039; --east:#5d9be0; --west:#3cc0b8; --south:#9a8ce6; --part:#f0b048; --shade:#7d8892; --off:#e5675a; --back:#9aa6b8;
  --sun:#f0b44a; --crit:#e66767; --ok:#5fbf86; --warn:#ec8a63; --warn-soft:#3a221a; --bz:#a5cf4a; --dcp:#e0675d; --dcm:#c9cfd4; --sky:#1c2227; --ground:#2a322f; --accent:#3987e5; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2c2c29; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e87; --line:#2f2f2c; --line-2:#3e3e3a;
  --ours:#4cb6cc; --ours-soft:#123039; --east:#5d9be0; --west:#3cc0b8; --south:#9a8ce6; --part:#f0b048; --shade:#7d8892; --off:#e5675a; --back:#9aa6b8;
  --sun:#f0b44a; --crit:#e66767; --ok:#5fbf86; --warn:#ec8a63; --warn-soft:#3a221a; --bz:#a5cf4a; --dcp:#e0675d; --dcm:#c9cfd4; --sky:#1c2227; --ground:#2a322f; --accent:#3987e5; }
*{box-sizing:border-box}

.compass svg{width:38px;height:38px}
.tip{position:absolute;left:0;top:0;z-index:6;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:6px 26px 7px 8px;font-size:12px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.14);max-width:330px}
.tip b{display:block;font-weight:650}

.tip .live{display:block;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.tip .live.off{color:var(--off);font-weight:600}
.tip .x{position:absolute;right:2px;top:2px;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--ink-3);font-size:14px;line-height:1}
.tip .x:hover{background:var(--surface-2);color:var(--ink)}
.tip .hm{display:block;margin-top:5px}
.tip .hm svg{width:100%;height:auto;display:block}
.tip .hm small{display:block;color:var(--ink-3);font-size:10.5px;margin-top:2px}

.sheet{flex:none;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -3px 12px rgba(0,0,0,.12);position:relative;z-index:8}

.grab i{display:block;width:44px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto}
.grab:hover i{background:var(--accent)}
.sunrow{display:flex;align-items:center;gap:8px;padding:2px var(--gr) 0 var(--gl)}

#play{background:var(--accent);border-color:var(--accent);color:var(--on-accent);min-width:38px}

.tabs::-webkit-scrollbar{display:none}

.ph{display:flex;flex-direction:column;gap:3px}

.ph p{margin:0;color:var(--ink-2)}

.kv dd small{display:block;font:400 11.5px var(--font);color:var(--ink-3)}
h3{margin:0 0 6px;font-size:12.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0}

.cmp{width:100%;border-collapse:collapse;font-size:12.5px}

.cmp tr.tot td{font-weight:650;color:var(--ink)}
.cmp tr.go{cursor:pointer} .cmp tr.go:hover td{background:var(--surface-2)} .cmp tr.cur td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.cmp td.l{text-align:left;font-family:var(--font)} .cmp td .swc{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.spec{width:100%;border-collapse:collapse;font-size:12.5px}
.spec td,.spec th{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}

.spec tr.it{cursor:pointer} .spec tr.it:hover td{background:var(--surface-2)} .spec tr.cur td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.spec td.n{text-align:right;font:500 12.5px var(--mono);white-space:nowrap} .spec td.r{text-align:center;color:var(--ink-3);font:500 11.5px var(--mono)}

.kosh small.bs{font:500 10.5px var(--mono);color:var(--ink-3)} .kosh tr.nf{cursor:default} .kosh tr.t td{font-weight:600;border-bottom:1px solid var(--line)} .kosh tr.t.big td{font-weight:750;background:color-mix(in srgb,var(--accent) 8%,transparent)} .kosh td.b{font-weight:650}
.note{border-radius:8px;padding:9px 11px;font-size:12.5px}

.lay{display:flex;flex-direction:column}

<div class="app">

function heatSVG(get, maxV, title, hours = [4, 21]) {
  const [h0, h1] = hours, cw = 18, ch = 14, l = 34, t = 14, W = l + (h1 - h0) * cw + 4, H = t + 12 * ch + 18;
  let s = '';
  for (let mo = 0; mo < 12; mo++) { s += `<text x="${l - 4}" y="${t + mo * ch + 10}" text-anchor="end" font-size="9" fill="var(--ink-3)">${MON[mo][LANG === 'en' ? 1 : 0]}</text>`;
    for (let h = h0; h < h1; h++) { const v = get(mo, h); if (v == null) continue; const a = Math.min(1, v / maxV); s += `<rect x="${l + (h - h0) * cw}" y="${t + mo * ch}" width="${cw - 1}" height="${ch - 1}" rx="2" fill="${v <= 0 ? 'var(--surface-2)' : `rgba(208,59,59,${(0.15 + 0.85 * a).toFixed(2)})`}"><title>${MON[mo][LANG === 'en' ? 1 : 0]} ${h}:00 — ${nf(v, 1)}</title></rect>`; } }
  for (let h = h0; h < h1; h += 2) s += `<text x="${l + (h - h0) * cw + cw / 2}" y="${H - 4}" text-anchor="middle" font-size="9" fill="var(--ink-3)">${h}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${s}</svg>`;
